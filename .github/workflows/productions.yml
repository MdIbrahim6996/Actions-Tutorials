name: Production Workflow
on:
    push:
        branches:
            - main

jobs:
    code:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              run: echo "Checking out code..."

    build:
        needs: [code]
        runs-on: ubuntu-latest
        steps:
            - name: Build Application
              run: echo "Building Application..."

    test:
        needs: [build]
        runs-on: ubuntu-latest
        steps:
            - name: Run Tests
              run: echo "Running Tests..."

    deploy:
        needs: [build, test]
        runs-on: ubuntu-latest
        steps:
            - name: Deploy Application
              run: echo "Deploying Application..."
